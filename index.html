<style>
[hidden]{display:none!important}
:root{--ink:#2a1d14;--paper:#fffaf0;--tape:#f3d36b;--tape2:#9fd0c7;--red:#d23a2a;--hand:"Yusei Magic","Hiragino Maru Gothic ProN",sans-serif;--pop:"RocknRoll One","Hiragino Sans",sans-serif;--sans:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#2a1d14}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--sans);color:var(--ink);overflow:hidden;height:100svh;background:#2a1d14}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-select:none}
.view{position:fixed;inset:0;height:100svh;overflow:hidden}
.room{background:#c9a77a url(img/room.webp?v=1) center/cover no-repeat}
.wrap{position:relative;height:100%;max-width:480px;margin:0 auto}

/* ロード画面: 鏡をふいて光らせる */
#loading{position:fixed;inset:0;z-index:90;background:#2a1d14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .35s}
#loading svg{width:120px;height:140px}
#loading p{font-family:var(--hand);font-size:16px;color:#f6e7c8;letter-spacing:.1em}
#loadBar{width:150px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:#f3d36b;transition:width .2s}
#cloth{animation:wipe 1.1s ease-in-out infinite alternate;transform-origin:60px 70px}
@keyframes wipe{0%{transform:translate(-18px,-10px) rotate(-12deg)}100%{transform:translate(16px,12px) rotate(10deg)}}

#corner{position:fixed;top:max(6px,env(safe-area-inset-top));right:6px;z-index:60;display:flex;gap:6px}
#corner button{min-width:40px;height:40px;border-radius:20px;background:rgba(42,29,20,.6);color:#fff3dc;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 10px}
#corner svg{width:20px;height:20px;fill:#fff3dc}

/* タイトル: 鏡に貼ったメモ */
#vTitle .wrap{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(54px + env(safe-area-inset-top)) 16px calc(18px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)))}
#vTitle::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(42,29,20,.15),rgba(42,29,20,.55))}
.tMirror{position:relative;width:min(62vw,250px,34svh);aspect-ratio:231/300}
.tMirror .mfr{position:absolute;inset:0;width:100%;height:100%}
.glass{position:absolute;left:15.5%;top:20.5%;width:69%;height:73%;border-radius:50%;overflow:hidden;background:#cfe3ec}
.glass img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.tNote{position:relative;margin-top:-6svh;background:var(--paper);padding:14px 18px 12px;transform:rotate(-2.5deg);box-shadow:0 8px 18px rgba(0,0,0,.35);text-align:center;width:min(86vw,330px)}
.tNote::before{content:"";position:absolute;left:50%;top:-11px;width:84px;height:22px;margin-left:-42px;background:var(--tape);opacity:.85;transform:rotate(3deg)}
.tNote h1{font-family:var(--pop);font-weight:400;font-size:clamp(30px,10vw,42px);line-height:1.15;letter-spacing:.02em}
.tNote h1 b{color:var(--red);font-weight:400}
.tNote p{font-family:var(--hand);font-size:16px;margin-top:4px;color:#5a4636}
.tBottom{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
#bStart{width:min(80vw,320px);min-height:58px;border-radius:10px;background:#d23a2a;color:#fff;font-family:var(--pop);font-size:20px;box-shadow:0 5px 0 #7d1d12,0 10px 22px rgba(0,0,0,.4)}
#bStart:active{transform:translateY(3px);box-shadow:0 2px 0 #7d1d12}
.tLinks{display:flex;gap:18px}
.tLinks button{min-height:42px;padding:0 10px;color:#fff3dc;font-family:var(--hand);font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* 遊び: 部屋 */
#vPlay .wrap{display:flex;flex-direction:column;padding:calc(6px + env(safe-area-inset-top)) 8px calc(6px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)))}
#hud{display:flex;align-items:flex-start;gap:8px;height:16svh;min-height:92px;padding-right:94px}
#cal{position:relative;width:min(24vw,104px);height:100%;flex:none}
.cpage{position:absolute;inset:8px 0 0;background:#fff;border-radius:2px;box-shadow:0 3px 8px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.cpage::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:#3a2b20}
.cpage small{font-size:11px;font-weight:700;margin-top:4px}
.cpage strong{font-family:var(--pop);font-weight:400;font-size:min(10vw,6svh,44px);line-height:1.05}
.cpage em{font-style:normal;font-family:var(--hand);color:var(--red);font-size:12px;min-height:14px;margin-top:2px;white-space:nowrap}
.cpage.last strong{color:var(--red)}
.cpage.fly{animation:fly .55s ease-in forwards;z-index:3}
@keyframes fly{0%{transform:none}30%{transform:translate(4px,-6px) rotate(4deg)}100%{transform:translate(60px,140px) rotate(38deg);opacity:0}}
#hpNote{position:relative;flex:1;max-width:150px;margin-top:10px;background:#fbe98a;padding:6px 8px 8px;transform:rotate(1.8deg);box-shadow:0 3px 7px rgba(0,0,0,.25);font-family:var(--hand)}
#hpNote b{font-weight:400;font-size:14px}
#hpNote span{float:right;font-size:14px}
#hpBar{display:flex;gap:3px;margin-top:4px}
#hpBar i{flex:1;height:16px;border-radius:2px 5px 3px 4px;background:#2f6b3a;transform:skewX(-8deg)}
#hpBar i.off{background:transparent;border:1.5px dashed rgba(42,29,20,.35)}
#hpNote.low #hpBar i:not(.off){background:#c2412c}
#pig{position:absolute;right:0;top:calc(4px + env(safe-area-inset-top) + 42px);width:92px;text-align:center}
#pig img{width:70px;display:block;margin:0 auto}
#money{display:inline-block;margin-top:-6px;background:var(--paper);padding:2px 7px;font-family:var(--hand);font-size:14px;box-shadow:0 2px 4px rgba(0,0,0,.3);transform:rotate(-3deg);white-space:nowrap}

#wall{display:flex;align-items:flex-end;justify-content:space-between;height:29svh;min-height:150px;margin-top:4px}
.obj{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;transition:transform .12s}
.obj img{display:block;max-width:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 5px 4px rgba(40,20,10,.35))}
.obj:active{transform:scale(.95)}
.obj.bump{animation:bump .45s ease-out}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.1,.92)}60%{transform:scale(.96,1.05)}100%{transform:none}}
.lab{display:block;background:var(--tape);padding:2px 7px 3px;font-family:var(--hand);font-size:clamp(12px,3.5vw,15px);line-height:1.15;white-space:nowrap;transform:rotate(-2deg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.lab small{display:block;font-size:10.5px;color:#5a4030}
.obj:nth-child(2n) .lab{background:var(--tape2);transform:rotate(1.5deg)}
.obj.deal .lab{background:#ffb4a4;outline:2px solid var(--red)}
.obj.deal .lab::after{content:attr(data-deal);display:block;color:var(--red);font-size:11px}
.obj.poor{opacity:.55}
#oShelf,#oRack{width:30%;height:100%}
#oShelf img,#oRack img{height:calc(100% - 64px);width:100%}
.gtag{position:relative;background:#2a1d14;color:#fff3dc;font-family:var(--hand);font-size:13px;padding:1px 7px;border-radius:3px;white-space:nowrap;z-index:2}
#mirror{position:relative;width:34%;height:100%;display:flex;align-items:flex-start;justify-content:center}
#mirror .mf{position:relative;height:88%;aspect-ratio:231/300}
#mirror .mf>img{position:absolute;inset:0;width:100%;height:100%}
#mirror .gtag{position:absolute;left:50%;bottom:0;transform:translateX(-50%)}
#mirror.glow .glass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 45%,transparent 60%);animation:shine 1s ease-out}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

#lineBox{position:relative;display:flex;justify-content:center;align-items:center;height:56px;margin:4px 0 2px}
#bubble{max-width:94%;background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:6px 14px;font-family:var(--hand);font-size:clamp(15px,4.3vw,18px);line-height:1.3;text-align:center;position:relative}
#bubble::before{content:"";position:absolute;left:50%;top:-10px;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom:10px solid var(--ink)}
#bubble.ev{background:#fff1c9}
#bubble.bad{background:#ffe1da}
#tip{position:absolute;left:0;right:0;top:-2px;text-align:center;font-family:var(--hand);font-size:13px;color:#fff;text-shadow:0 1px 2px #000,0 0 6px #000;pointer-events:none}

#floor{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:2px 4px;align-items:end}
#floor .obj{height:100%;min-height:0;min-width:0}
#floor .obj img{flex:1;min-height:0;height:0;width:100%;max-width:100%}
#oBed{grid-column:span 2}
#oBed img{max-width:100%}

.float{position:fixed;z-index:30;font-family:var(--pop);font-size:20px;pointer-events:none;color:#1f7a39;text-shadow:0 0 3px #fff,0 0 6px #fff;animation:up 1.1s ease-out forwards;white-space:nowrap}
.float.neg{color:#c2412c}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-46px);opacity:0}}
#hand{position:fixed;z-index:35;width:44px;height:44px;pointer-events:none;animation:poke 1s ease-in-out infinite}
@keyframes poke{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-8px)}}

/* できごとの2択: 郵便受けのメモ */
#memo{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(30,20,12,.45)}
#memoCard{width:min(86vw,340px);background:var(--paper);padding:18px 16px 14px;transform:rotate(-1.5deg);box-shadow:0 12px 26px rgba(0,0,0,.45);text-align:center}
#memoCard p{font-family:var(--hand);font-size:clamp(17px,5vw,20px);line-height:1.4;margin-bottom:12px}
#memoCard .btns{display:flex;gap:8px}
#memoCard button{flex:1;min-height:48px;border:2px solid var(--ink);border-radius:8px;font-weight:700;font-size:15px;background:#fff}
#memoCard button:first-child{background:#2a1d14;color:#fff3dc}

/* 30日後: アパートのドア */
#vReveal{background:radial-gradient(ellipse at 50% 45%,#5b4636,#1d140e 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(54px + env(safe-area-inset-top)) 14px calc(14px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)))}
#rvText{font-family:var(--pop);color:#fff3dc;font-size:clamp(18px,5.4vw,24px);text-align:center;min-height:1.6em;text-shadow:0 2px 8px #000}
#stage{position:relative;width:min(78vw,330px,40svh);aspect-ratio:2/3;perspective:900px}
#portrait{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:6px solid #3a3a3a;background:#111}
#door{position:absolute;inset:0;transform-origin:0 50%;background:linear-gradient(90deg,#b9bcbf,#d9dcde 40%,#c3c6c9);border:6px solid #3a3a3a;box-shadow:inset 0 0 0 2px #9a9da0;transition:transform 1.1s cubic-bezier(.5,0,.3,1)}
#door.open{transform:rotateY(-104deg)}
#door .plate{position:absolute;left:50%;top:9%;transform:translateX(-50%);background:#f2efe6;padding:2px 10px;font-family:var(--pop);font-size:15px;border:1px solid #666}
#door .knob{position:absolute;right:8%;top:52%;width:12%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9a8f7a 55%,#5a5040)}
#door .slot{position:absolute;left:30%;right:30%;top:68%;height:4%;background:#6d7073;border-radius:2px}
#door .eye{position:absolute;left:50%;top:30%;width:5%;aspect-ratio:1;border-radius:50%;background:#333;transform:translateX(-50%)}
#door.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{margin-left:0}50%{margin-left:2px}100%{margin-left:-2px}}
#nameTag{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%) rotate(-3deg) scale(2.2);opacity:0;background:var(--red);color:#fff;font-family:var(--pop);font-size:clamp(16px,5vw,21px);padding:4px 14px;white-space:nowrap;transition:transform .22s cubic-bezier(.3,1.5,.5,1),opacity .15s;box-shadow:0 4px 10px rgba(0,0,0,.4)}
#nameTag small{display:block;font-family:var(--hand);font-size:12px;text-align:center}
#nameTag.in{opacity:1;transform:translateX(-50%) rotate(-3deg) scale(1)}
#say{position:absolute;right:-6px;top:6%;max-width:62%;background:#fff;border:2px solid #111;border-radius:14px;padding:6px 10px;font-family:var(--hand);font-size:clamp(14px,4.2vw,17px);line-height:1.3;opacity:0;transition:opacity .3s}
#say.in{opacity:1}
#epi{font-family:var(--hand);color:#fff3dc;font-size:clamp(15px,4.4vw,18px);text-align:center;min-height:2.7em;margin-top:14px;line-height:1.35;max-width:92vw}
#bNext{min-height:50px;min-width:200px;border-radius:10px;background:#d23a2a;color:#fff;font-family:var(--pop);font-size:18px;box-shadow:0 4px 0 #7d1d12}
#flash{position:fixed;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none}

/* 結果: 招待状 */
#vEnd{background:radial-gradient(ellipse at 50% 30%,#5b4636,#1d140e);display:flex;flex-direction:column;align-items:center;padding:calc(50px + env(safe-area-inset-top)) 10px calc(8px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)));gap:8px}
#cardBox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#card{display:block;max-width:100%;max-height:100%;box-shadow:0 12px 28px rgba(0,0,0,.5)}
.endBtns{width:min(100%,420px);display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px}
.row button{flex:1;min-height:44px;border-radius:8px;background:rgba(255,243,220,.1);border:1px solid rgba(255,243,220,.4);color:#fff3dc;font-weight:700;font-size:14px}
#bAgain{background:#d23a2a;border:0;font-family:var(--pop);font-weight:400;font-size:16px}

/* 図鑑・遊び方 */
.ovl{position:fixed;inset:0;z-index:45;background:rgba(29,20,14,.96);display:flex;flex-direction:column;padding:calc(52px + env(safe-area-inset-top)) 12px calc(10px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)));gap:8px;color:#fff3dc}
.ovl h2{font-family:var(--pop);font-weight:400;font-size:20px}
.ovl h2 span{font-family:var(--hand);font-size:15px;margin-left:8px;color:#f3d36b}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:6px}
.cell{position:relative;border-radius:6px;overflow:hidden;background:#3a2b20;border:1px solid rgba(255,243,220,.2);min-height:0}
.cell img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.cell b{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);font-size:10.5px;font-weight:700;text-align:center;padding:1px 0;white-space:nowrap;overflow:hidden}
.cell.lock{display:flex;align-items:center;justify-content:center;font-family:var(--pop);font-size:22px;color:rgba(255,243,220,.35)}
.cell.sel{outline:2px solid #f3d36b}
#bookInfo{min-height:2.8em;font-family:var(--hand);font-size:14px;line-height:1.35}
.ovl .close{min-height:46px;border-radius:8px;background:rgba(255,243,220,.12);border:1px solid rgba(255,243,220,.4);font-weight:700}
#howBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
#howBody p{font-size:clamp(13px,3.8vw,15px);line-height:1.55}
#howBody small{margin-top:auto;font-size:10.5px;line-height:1.45;color:#c9b597}
#howBody a{color:#fff3dc;font-size:13px;display:inline-flex;min-height:36px;align-items:center}

/* 鏡が変わった時のひとこと */
#meNote{position:absolute;left:50%;top:-4px;z-index:3;transform:translate(-50%,0) rotate(-3deg);background:var(--red);color:#fff;font-family:var(--hand);font-size:13px;padding:2px 8px;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.3);opacity:0;pointer-events:none}
#meNote.in{animation:meN 2.4s ease-out forwards}
@keyframes meN{0%{opacity:0;transform:translate(-50%,8px) rotate(-3deg) scale(1.4)}12%{opacity:1;transform:translate(-50%,0) rotate(-3deg) scale(1)}80%{opacity:1}100%{opacity:0}}

/* PR（結果画面だけ） */
#affBox{display:flex;flex-direction:column;align-items:center;gap:3px;width:min(100%,420px);flex:none}
#bAff{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;max-width:100%;padding:0 14px;border-radius:8px;border:1px solid rgba(255,243,220,.4);color:#fff3dc;font-size:14px;font-weight:700;text-decoration:none;text-align:left;line-height:1.25}
#bAff .pr{flex:none;font-size:13px;font-weight:700;border:1.5px solid #fff3dc;border-radius:3px;padding:0 5px;line-height:1.45}
#affNote{font-size:11px;color:#c9b597}

/* トーク（架空のアプリ「こいぶみ」） */
#chat{position:fixed;inset:0;z-index:47;background:#1d140e;display:flex;justify-content:center}
#chat .ph0{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:#f4e8d4}
.chHead{flex:none;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 104px 7px 2px;background:#c8552e;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#chBack{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 6px 0 2px;font-size:13px;font-weight:700;color:#fff;flex:none}
#chBack svg{width:22px;height:22px}
#chAv{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:2px solid #fff;flex:none}
.chWho{min-width:0;line-height:1.2}
#chName{display:block;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chTag{display:block;font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chLog{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:10px 10px 16px;display:flex;flex-direction:column;gap:7px;background:#f4e8d4 radial-gradient(rgba(42,29,20,.06) 1px,transparent 1.5px) 0 0/14px 14px}
#chLog .m{display:flex;align-items:flex-end;gap:6px;max-width:100%}
#chLog .m.y{flex-direction:row-reverse}
#chLog .m.in,#chLog .sys.in{animation:msgIn .28s ease-out both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
#chLog .av{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 15%;flex:none;border:1.5px solid #2a1d14;align-self:flex-start}
#chLog .bb{max-width:68%;padding:7px 12px;border-radius:16px;font-size:15px;line-height:1.4;overflow-wrap:anywhere;border:1.5px solid #2a1d14;background:#fff}
#chLog .y .bb{background:#ffd36b;border-bottom-right-radius:4px}
#chLog .p .bb{border-bottom-left-radius:4px}
#chLog .meta{flex:none;display:flex;flex-direction:column;font-size:10px;line-height:1.25;color:#7a6550;align-items:flex-end}

#chLog .ph img{display:block;width:min(42vw,160px);aspect-ratio:3/4;object-fit:cover;object-position:50% 15%;border-radius:12px;border:2px solid #2a1d14}
#chLog .pic{width:min(36vw,140px);aspect-ratio:1;border-radius:12px;border:2px solid #2a1d14;background:#fff6df;padding:14px}
#chLog .pic svg,#chLog .st svg{display:block;width:100%;height:100%}
#chLog .st{width:84px;height:84px}
#chLog .vc{display:flex;align-items:center;gap:8px}
#chLog .vc .play{width:16px;height:16px;fill:#c8552e;flex:none}
#chLog .vc .wave{display:flex;align-items:center;gap:2px;height:18px}
#chLog .vc .wave i{display:block;width:3px;border-radius:2px;background:#2a1d14;height:40%}
#chLog .vc .wave i:nth-child(3n){height:90%}#chLog .vc .wave i:nth-child(4n+1){height:65%}#chLog .vc .wave i:nth-child(5n+2){height:25%}
#chLog .vc b{font-size:13px;font-weight:700}
#chLog .sys{align-self:center;background:rgba(42,29,20,.16);color:#5a4636;font-size:11px;font-weight:700;padding:2px 12px;border-radius:10px;margin:3px 0}
#chLog .sys.brand{background:none;color:#c8552e;font-family:var(--pop);font-weight:400;font-size:13px;letter-spacing:.1em}
.chFoot{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)));background:#fffaf0;border-top:1px solid #e0cfb4}
#chText{flex:1;min-width:0;height:38px;border-radius:19px;border:1.5px solid #e0cfb4;background:#fff;color:var(--ink);font:16px var(--sans);padding:0 14px;-webkit-user-select:text;user-select:text;outline:none}
#chText:focus{border-color:#c8552e}
#chText:disabled{background:#efe3cf}
#chText::placeholder{color:#a08c74}
.chFoot.wait{opacity:.6}
.chFoot[hidden]{display:none}
#chSend{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}

#chSend:disabled circle{fill:#e3c9a8}
#chLog .mine .unread{color:#c8552e;font-weight:700}

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a,input')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  // 読み込み中を失敗と出さない: JS が動いたか（__jsUp）で見る
  setTimeout(function(){
    if(window.__jsUp) return;
    var l=document.getElementById('loading');if(l)l.style.display='none';
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:199;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },15000);
})();
</script>
